<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桜台自治会 イベント申込</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --main: #2e7d4f; --main-light: #e8f3ec; --line: #d6dbd8; --text: #222; --sub: #666; --warn: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 17px; color: var(--text); background: #f6f7f6; line-height: 1.6; }
  header { background: var(--main); color: #fff; padding: 12px 16px; font-weight: bold; font-size: 18px; }
  nav { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  nav button { flex: 1; border: none; background: none; padding: 12px 4px; font-size: 16px; color: var(--sub); border-bottom: 3px solid transparent; }
  nav button.active { color: var(--main); border-bottom-color: var(--main); font-weight: bold; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .meta { color: var(--sub); font-size: 15px; margin: 2px 0; }
  .detail { white-space: pre-wrap; margin: 8px 0; font-size: 15px; }
  .badge { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 10px; background: var(--main-light); color: var(--main); margin-left: 6px; vertical-align: middle; }
  .badge.off { background: #eee; color: var(--sub); }
  .badge.warn { background: #fdecea; color: var(--warn); }
  button.primary, button.secondary, button.danger { display: block; width: 100%; padding: 12px; font-size: 17px; border-radius: 8px; margin-top: 10px; }
  button.primary { background: var(--main); color: #fff; border: none; font-weight: bold; }
  button.primary:disabled { background: #aab5ae; }
  button.secondary { background: #fff; color: var(--main); border: 1px solid var(--main); }
  button.danger { background: #fff; color: var(--warn); border: 1px solid var(--warn); }
  .row-buttons { display: flex; gap: 8px; }
  .row-buttons button { margin-top: 10px; }
  label { display: block; font-weight: bold; margin-top: 12px; font-size: 15px; }
  .req { color: var(--warn); font-size: 13px; margin-left: 4px; }
  input, select, textarea { width: 100%; font-size: 17px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-family: inherit; }
  textarea { min-height: 70px; }
  .person { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .person input { flex: 1; }
  .person select { width: 96px; flex: none; }
  .person .remove { flex: none; width: 40px; height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 18px; color: var(--sub); }
  .total { margin-top: 10px; font-weight: bold; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .msg.error { background: #fdecea; color: var(--warn); }
  .msg.info { background: var(--main-light); color: var(--main); }
  .muted { color: var(--sub); font-size: 14px; }
  .center { text-align: center; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 6px; }
  table.summary th { text-align: left; color: var(--sub); font-weight: normal; width: 6em; vertical-align: top; padding: 3px 0; }
  table.summary td { padding: 3px 0; }
  .link { background: none; border: none; color: var(--main); text-decoration: underline; font-size: 15px; padding: 8px 0; }
  details summary { font-weight: bold; color: var(--main); padding: 4px 0; }
  .spinner { text-align: center; color: var(--sub); padding: 40px 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dialog { background: #fff; border-radius: 12px; padding: 20px 16px 16px; width: 100%; max-width: 420px; }
  .dialog p { margin: 0 0 8px; white-space: pre-wrap; }
  .dialog input { margin-top: 4px; }
</style>
</head>
<body>
<header>桜台自治会 イベント申込</header>
<nav id="tabs"></nav>
<main id="view"><div class="spinner">読み込んでいます…</div></main>

<script>
// ▼ここを書き換える
const LIFF_ID = '2012762100-MDD2iVkw';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9djrb8oKq1ag8E7e505eFn8BEtFnhYhb-JaXA1GbuZ2bEQTUPr5GD0bD7zAFf5_uU/exec';
// ▲ここまで

const state = { isStaff: false, isAdmin: false, depts: [], assignable: [], staffName: "", last: null, tab: "events", events: [], draft: null, maxPeople: 10 };
const view = document.getElementById("view");

// ---------- 共通 ----------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(action, data) {
  const idToken = liff.getIDToken();
  if (!idToken) throw new Error("LINEのログイン情報が取れませんでした。画面を閉じて開き直してください。");
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({}, data || {}, { action, idToken })),
  });
  const json = await res.json();
  if (!json.ok) {
    const err = new Error(json.error || "エラーが起きました。");
    err.data = json;
    throw err;
  }
  return json;
}

function loading(text) {
  view.innerHTML = `<div class="spinner">${esc(text || "読み込んでいます…")}</div>`;
}

function errorBox(e) {
  return `<div class="msg error">${esc(e && e.message ? e.message : e)}</div>`;
}

// 画面の中に出す確認・入力・お知らせ。
// （ブラウザ標準のダイアログはサイトのアドレスが表示されるため使わない）
// 戻り値：確認 → true／false、入力 → 入力した文字／null、お知らせ → true
function dialog({ message, okText = "OK", cancelText = null, danger = false, input = null }) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
      <p>${esc(message)}</p>
      ${input ? `<input id="dlg-input" value="${esc(input.value || "")}" placeholder="${esc(input.placeholder || "")}"${input.numeric ? ' inputmode="numeric"' : ""}>` : ""}
      <div class="row-buttons">
        ${cancelText ? `<button class="secondary" id="dlg-cancel">${esc(cancelText)}</button>` : ""}
        <button class="${danger ? "danger" : "primary"}" id="dlg-ok">${esc(okText)}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const field = ov.querySelector("#dlg-input");
    const close = value => { ov.remove(); resolve(value); };
    ov.querySelector("#dlg-ok").onclick = () => close(input ? field.value : true);
    const cancel = ov.querySelector("#dlg-cancel");
    if (cancel) cancel.onclick = () => close(input ? null : false);
    if (field) field.focus();
  });
}
const alertBox = message => dialog({ message });
const confirmBox = (message, okText, danger) => dialog({ message, okText: okText || "はい", cancelText: "やめる", danger });

function badgeClass(s) {
  if (s === "受付中") return "badge";
  if (s === "残りわずか") return "badge warn";
  return "badge off";
}

function renderTabs() {
  const tabs = [["events", "イベント"], ["mine", "わたしの申込"]];
  if (state.isStaff) tabs.push(["staff", "担当者"]);
  const nav = document.getElementById("tabs");
  nav.innerHTML = tabs.map(([k, label]) =>
    `<button data-tab="${k}" class="${state.tab === k ? "active" : ""}">${label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.tab));
}

function go(tab) {
  state.tab = tab;
  renderTabs();
  window.scrollTo(0, 0);
  if (tab === "events") showEvents();
  else if (tab === "mine") showMine();
  else if (tab === "staff") showStaff();
}

function eventInfo(ev) {
  let html = `<p class="meta">📅 ${esc(ev.dateLabel)}${ev.time ? " " + esc(ev.time) : ""}</p>`;
  if (ev.place) html += `<p class="meta">📍 ${esc(ev.place)}</p>`;
  if (ev.dept) html += `<p class="meta">👥 担当：${esc(ev.dept)}</p>`;
  return html;
}

function setStaff(info) {
  state.isStaff = !!info.isStaff;
  state.isAdmin = !!info.isAdmin;
  state.depts = info.depts || [];
  state.assignable = info.assignable || [];
}

// ---------- イベント一覧 ----------
async function showEvents(notice) {
  loading();
  try {
    const r = await api("events");
    state.events = r.events;
    let html = notice ? `<div class="msg info">${esc(notice)}</div>` : "";
    if (!r.events.length) html += `<div class="card center muted">いま受け付けているイベントはありません。</div>`;
    r.events.forEach(ev => {
      let foot = "";
      if (ev.deadlineLabel) foot += `申込締切：${esc(ev.deadlineLabel)}　`;
      if (ev.capacity) foot += `定員${ev.capacity}人（残り${ev.remaining}人）`;
      if (ev.waiting) foot += `　キャンセル待ち${ev.waiting}組`;
      // 自分の申込の状態と、イベントの受付状態を並べて出す（申込済みでも満員などがわかるように）
      let badges = "";
      if (ev.applied === "申込") badges += `<span class="badge">申込済み</span>`;
      else if (ev.applied === "キャンセル待ち") badges += `<span class="badge warn">キャンセル待ち中</span>`;
      if (!ev.applied || ev.state !== "受付中") badges += `<span class="${badgeClass(ev.state)}">${esc(ev.state)}</span>`;
      let button = "";
      if (!ev.applied && ev.mode === "apply") {
        button = `<button class="primary" data-apply="${esc(ev.id)}">申し込む</button>`;
      } else if (!ev.applied && ev.mode === "wait") {
        button = `<p class="muted">${ev.state === "満員" ? "定員に達しています。" : "キャンセル待ちの方がいます。"}キャンセル待ちで申し込むと、取り消しが出たときに申し込んだ順に繰り上がります。</p>
          <button class="secondary" data-apply="${esc(ev.id)}">キャンセル待ちで申し込む</button>`;
      }
      html += `<div class="card">
        <h2>${esc(ev.name)}${badges}</h2>
        ${eventInfo(ev)}
        ${ev.detail ? `<p class="detail">${esc(ev.detail)}</p>` : ""}
        ${foot ? `<p class="muted">${foot}</p>` : ""}
        ${button}
      </div>`;
    });
    view.innerHTML = html;
    view.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => startApply(b.dataset.apply));
  } catch (e) {
    view.innerHTML = errorBox(e);
  }
}

// ---------- 申込フォーム ----------
function startApply(eventId) {
  const ev = state.events.find(x => x.id === eventId);
  const last = state.last || {};
  state.draft = {
    event: ev,
    wait: ev.mode === "wait",
    name: last.name || "", address: last.address || "", phone: last.phone || "", note: "",
    participants: [{ name: last.name || "", kind: "大人" }],
  };
  showForm();
}

function showForm(err) {
  const d = state.draft, ev = d.event;
  let html = err ? errorBox(err) : "";
  if (d.wait) html += `<div class="msg info">キャンセル待ちでのお申し込みになります。</div>`;
  html += `<div class="card"><h2>${esc(ev.name)}</h2>${eventInfo(ev)}</div>
  <div class="card">
    <h2>代表者</h2>
    <label>氏名<span class="req">必須</span></label><input id="f-name" value="${esc(d.name)}" autocomplete="name">
    <label>住所<span class="req">必須</span></label><input id="f-address" value="${esc(d.address)}" placeholder="例：花巻市桜台1丁目2-3" autocomplete="street-address">
    <label>電話番号<span class="req">必須</span></label><input id="f-phone" value="${esc(d.phone)}" inputmode="tel" placeholder="例：0198-12-3456" autocomplete="tel">
  </div>
  <div class="card">
    <h2>参加者</h2>
    <p class="muted">同じ世帯で一緒に参加する方を全員入れてください。別の世帯の方は、それぞれお申し込みください。</p>
    <div id="people"></div>
    <button class="secondary" id="add-person">＋ 参加者を追加</button>
    <p class="total" id="total"></p>
  </div>
  <div class="card">
    <label style="margin-top:0">備考</label>
    <textarea id="f-note" placeholder="連絡事項があればご記入ください">${esc(d.note)}</textarea>
  </div>
  <button class="primary" id="to-confirm">入力内容を確認する</button>
  <button class="link" id="back">← イベント一覧に戻る</button>`;
  view.innerHTML = html;
  renderPeople();
  document.getElementById("add-person").onclick = () => {
    readForm();
    d.participants.push({ name: "", kind: "大人" });
    renderPeople();
    const inputs = document.querySelectorAll("#people input");
    inputs[inputs.length - 1].focus();
  };
  document.getElementById("to-confirm").onclick = () => { readForm(); confirmForm(); };
  document.getElementById("back").onclick = () => go("events");
  // 代表者の氏名を、1人目の参加者に写す（1人目が空か、前と同じ名前のとき）
  const nameInput = document.getElementById("f-name");
  nameInput.onchange = () => {
    const first = document.querySelector("#people input");
    if (first && (!first.value || first.value === d.name)) first.value = nameInput.value;
    d.name = nameInput.value;
  };
  window.scrollTo(0, 0);
}

function renderPeople() {
  const d = state.draft;
  const box = document.getElementById("people");
  box.innerHTML = d.participants.map((p, i) => `<div class="person">
      <input data-i="${i}" value="${esc(p.name)}" placeholder="${i + 1}人目の氏名">
      <select data-i="${i}">
        <option ${p.kind === "大人" ? "selected" : ""}>大人</option>
        <option ${p.kind === "子ども" ? "selected" : ""}>子ども</option>
      </select>
      ${d.participants.length > 1 ? `<button class="remove" data-i="${i}" aria-label="削除">×</button>` : ""}
    </div>`).join("");
  box.querySelectorAll(".remove").forEach(b => b.onclick = () => {
    readForm();
    d.participants.splice(Number(b.dataset.i), 1);
    renderPeople();
  });
  box.querySelectorAll("select").forEach(s => s.onchange = () => { readForm(); updateTotal(); });
  updateTotal();
}

function updateTotal() {
  const ps = state.draft.participants;
  const adult = ps.filter(p => p.kind === "大人").length;
  document.getElementById("total").textContent = `合計 ${ps.length}人（大人${adult}人・子ども${ps.length - adult}人）`;
}

function readForm() {
  const d = state.draft;
  d.name = document.getElementById("f-name").value.trim();
  d.address = document.getElementById("f-address").value.trim();
  d.phone = document.getElementById("f-phone").value.trim();
  d.note = document.getElementById("f-note").value.trim();
  const names = document.querySelectorAll("#people input");
  const kinds = document.querySelectorAll("#people select");
  d.participants = Array.from(names).map((el, i) => ({ name: el.value.trim(), kind: kinds[i].value }));
}

function confirmForm() {
  const d = state.draft;
  const problems = [];
  if (!d.name) problems.push("代表者の氏名を入力してください。");
  if (!d.address) problems.push("住所を入力してください。");
  if (!d.phone) problems.push("電話番号を入力してください。");
  // 空の参加者行は捨てる
  d.participants = d.participants.filter(p => p.name);
  if (!d.participants.length) { problems.push("参加者を1人以上入力してください。"); d.participants = [{ name: "", kind: "大人" }]; }
  if (problems.length) { showForm(problems.join(" ")); return; }

  const adult = d.participants.filter(p => p.kind === "大人").length;
  view.innerHTML = `<div class="msg info">まだ申し込みは終わっていません。内容を確かめて「この内容で申し込む」を押してください。${d.wait ? "<br><b>キャンセル待ちでのお申し込みです。</b>" : ""}</div>
  <div class="card">
    <h2>${esc(d.event.name)}</h2>${eventInfo(d.event)}
    <table class="summary">
      <tr><th>代表者</th><td>${esc(d.name)}</td></tr>
      <tr><th>住所</th><td>${esc(d.address)}</td></tr>
      <tr><th>電話番号</th><td>${esc(d.phone)}</td></tr>
      <tr><th>参加者</th><td>${d.participants.map(p => `${esc(p.name)}（${esc(p.kind)}）`).join("<br>")}</td></tr>
      <tr><th>人数</th><td>${d.participants.length}人（大人${adult}人・子ども${d.participants.length - adult}人）</td></tr>
      ${d.note ? `<tr><th>備考</th><td style="white-space:pre-wrap">${esc(d.note)}</td></tr>` : ""}
    </table>
  </div>
  <button class="primary" id="submit">この内容で申し込む</button>
  <button class="secondary" id="fix">入力に戻って直す</button>`;
  document.getElementById("fix").onclick = () => showForm();
  document.getElementById("submit").onclick = submitApply;
  window.scrollTo(0, 0);
}

async function submitApply() {
  const d = state.draft;
  const btn = document.getElementById("submit");
  btn.disabled = true;
  btn.textContent = "送信しています…";
  try {
    const r = await api("apply", {
      eventId: d.event.id, name: d.name, address: d.address, phone: d.phone, note: d.note,
      participants: d.participants, allowWaitlist: d.wait,
    });
    state.last = { name: d.name, address: d.address, phone: d.phone };
    view.innerHTML = `<div class="card center">
      <h2>${r.waitlisted ? `キャンセル待ち（${r.position}番目）で<br>受け付けました` : "お申し込みを受け付けました"}</h2>
      <p>${esc(d.event.name)}<br>${esc(d.event.dateLabel)}</p>
      ${r.waitlisted ? `<p>参加できることになったら、公式LINEでお知らせします。</p>` : ""}
      <p class="muted">申込番号：${esc(r.id)}</p>
      <p class="muted">${r.notified ? "公式LINEに受付のお知らせを送りました。" : "お知らせを送れませんでしたが、お申し込みは受け付けています。"}</p>
    </div>
    <button class="secondary" id="done">イベント一覧に戻る</button>`;
    document.getElementById("done").onclick = () => go("events");
    state.draft = null;
  } catch (e) {
    // 送信の間に定員を超えた場合は、キャンセル待ちでよいか確かめて送り直す
    if (e.data && e.data.needWaitlist && !d.wait) {
      if (await confirmBox(e.message, "キャンセル待ちで申し込む")) {
        d.wait = true;
        submitApply();
      } else {
        go("events");
      }
      return;
    }
    showForm(e);
  }
}

// ---------- わたしの申込 ----------
async function showMine() {
  loading();
  try {
    const r = await api("mine");
    let html = "";
    if (!r.applications.length) html += `<div class="card center muted">開催前のお申し込みはありません。</div>`;
    r.applications.forEach(a => {
      let badge = "";
      if (a.eventCanceled) badge = `<span class="badge warn">中止</span>`;
      else if (a.status === "キャンセル待ち") badge = `<span class="badge warn">キャンセル待ち ${a.position}番目</span>`;
      else badge = `<span class="badge">参加決定</span>`;
      html += `<div class="card">
        <h2>${esc(a.event.name)}${badge}</h2>
        ${eventInfo(a.event)}
        <table class="summary">
          <tr><th>参加者</th><td>${a.participants.map(p => `${esc(p.name)}（${esc(p.kind)}）`).join("<br>")}</td></tr>
          <tr><th>人数</th><td>${a.count}人（大人${a.adult}人・子ども${a.child}人）</td></tr>
          <tr><th>申込番号</th><td>${esc(a.id)}</td></tr>
        </table>
        ${a.eventCanceled ? "" : `<button class="danger" data-cancel="${esc(a.id)}">この申込を取り消す</button>`}
      </div>`;
    });
    html += `<p class="muted">人数を変えたいときは、取り消してから申し込み直してください。</p>`;
    if (!state.isStaff) html += `<p class="center"><button class="link" id="staff-reg">担当者の方はこちら</button></p>`;
    view.innerHTML = html;
    view.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
      if (!(await confirmBox("この申込を取り消します。よろしいですか？", "取り消す", true))) return;
      b.disabled = true;
      try {
        await api("cancel", { id: b.dataset.cancel });
        showMine();
      } catch (e) {
        b.disabled = false;
        alertBox(e.message);
      }
    });
    const reg = document.getElementById("staff-reg");
    if (reg) reg.onclick = () => showStaffRegister();
  } catch (e) {
    view.innerHTML = errorBox(e);
  }
}

// ---------- 担当者登録 ----------
function showStaffRegister(err) {
  const more = state.isStaff;
  view.innerHTML = `${err ? errorBox(err) : ""}<div class="card">
    <h2>${more ? "別の部の担当者としても登録" : "担当者の登録"}</h2>
    <p class="muted">${more
      ? `いまの担当：${esc(state.depts.join("、"))}。もう1つの部の合言葉を入れると、その部のイベントも扱えるようになります。`
      : "所属する部の合言葉（部の役員から聞いたもの）を入れると、その部のイベントを扱う「担当者」タブが出るようになります。"}</p>
    <label>お名前</label><input id="s-name" value="${esc(state.staffName || "")}">
    <label>合言葉</label><input id="s-code" autocomplete="off">
    <button class="primary" id="s-submit">登録する</button>
  </div>
  <button class="link" id="back">← 戻る</button>`;
  document.getElementById("back").onclick = () => go(more ? "staff" : "mine");
  document.getElementById("s-submit").onclick = async () => {
    try {
      const name = document.getElementById("s-name").value;
      const r = await api("staffRegister", { name, code: document.getElementById("s-code").value });
      setStaff(r);
      state.staffName = name;
      state.tab = "staff";
      renderTabs();
      showStaff(`${r.registered}の担当者として登録しました。`);
    } catch (e) {
      showStaffRegister(e);
    }
  };
}

// ---------- 担当者メニュー ----------
async function showStaff(notice) {
  loading();
  try {
    const r = await api("staffEvents");
    setStaff(r);
    if (!r.isStaff) { go("mine"); return; }
    let html = notice ? `<div class="msg info">${esc(notice)}</div>` : "";
    html += `<p class="muted">${r.isAdmin ? "管理者として、すべての部のイベントを扱えます。" : `担当：${esc(r.depts.join("、"))}のイベントを扱えます。`}
      <button class="link" id="more-dept">別の部も担当する</button></p>`;
    const deptOptions = r.assignable.map(d => `<option>${esc(d)}</option>`).join("");
    html += `<div class="card"><details id="add-box"><summary>＋ イベントを登録する</summary>
      <label>担当部<span class="req">必須</span></label>
      <select id="e-dept">${r.assignable.length > 1 ? `<option value="">選んでください</option>` : ""}${deptOptions}</select>
      <label>イベント名<span class="req">必須</span></label><input id="e-name">
      <label>開催日<span class="req">必須</span></label><input id="e-date" type="date">
      <label>時間</label><input id="e-time" placeholder="例：9:00〜12:00">
      <label>場所</label><input id="e-place" placeholder="例：桜台自治会館">
      <label>内容</label><textarea id="e-detail" placeholder="持ち物や注意事項など"></textarea>
      <label>申込締切</label><input id="e-deadline" type="date">
      <label>定員（人）</label><input id="e-cap" inputmode="numeric" placeholder="制限なしなら空欄">
      <button class="primary" id="e-submit">登録する</button>
    </details></div>`;
    if (!r.events.length) html += `<div class="card center muted">担当のイベントはまだありません。</div>`;
    r.events.forEach(ev => {
      const s = ev.summary;
      if (!ev.dept) ev.dept = "（未設定：シートで担当部を入れてください）";
      const capText = ev.capacity ? ` / 定員${ev.capacity}人` : " / 定員なし";
      let buttons = "";
      if (!ev.past && ev.status !== "中止") {
        buttons = `<button class="secondary" data-cap="${esc(ev.id)}" data-current="${ev.capacity || ""}" data-people="${s.people}">定員を変更する</button>
        <div class="row-buttons">
          ${ev.status === "受付中"
            ? `<button class="secondary" data-status="締切" data-id="${esc(ev.id)}">締切にする</button>`
            : `<button class="secondary" data-status="受付中" data-id="${esc(ev.id)}">受付に戻す</button>`}
          <button class="danger" data-status="中止" data-id="${esc(ev.id)}">中止にする</button>
        </div>`;
      }
      html += `<div class="card">
        <h2>${esc(ev.name)}<span class="${badgeClass(ev.state)}">${esc(ev.state)}</span></h2>
        ${eventInfo(ev)}
        <p class="meta">参加決定 ${s.apps}件・${s.people}人（大人${s.adult}・子ども${s.child}）${capText}</p>
        ${s.waitApps ? `<p class="meta" style="color:var(--warn)">キャンセル待ち ${s.waitApps}件・${s.waitPeople}人</p>` : ""}
        <button class="secondary" data-list="${esc(ev.id)}">申込者を見る</button>
        ${buttons}
      </div>`;
    });
    view.innerHTML = html;
    document.getElementById("e-submit").onclick = addEvent;
    document.getElementById("more-dept").onclick = () => showStaffRegister();
    view.querySelectorAll("[data-list]").forEach(b => b.onclick = () => showApplicants(b.dataset.list));
    view.querySelectorAll("[data-status]").forEach(b => b.onclick = () => changeStatus(b.dataset.id, b.dataset.status, b));
    view.querySelectorAll("[data-cap]").forEach(b => b.onclick = () => changeCapacity(b));
  } catch (e) {
    view.innerHTML = errorBox(e);
  }
}

async function addEvent() {
  const v = id => document.getElementById(id).value;
  const btn = document.getElementById("e-submit");
  btn.disabled = true;
  try {
    await api("staffAddEvent", {
      dept: v("e-dept"), name: v("e-name"), date: v("e-date"), time: v("e-time"), place: v("e-place"),
      detail: v("e-detail"), deadline: v("e-deadline"), capacity: v("e-cap"),
    });
    showStaff("イベントを登録しました。参加者の画面に表示されます。");
  } catch (e) {
    btn.disabled = false;
    alertBox(e.message);
  }
}

async function changeStatus(eventId, status, btn) {
  let reason = "";
  if (status === "中止") {
    reason = await dialog({
      message: "中止の理由を入れてください。申込者へのお知らせに書きます（空欄でも構いません）。",
      input: { placeholder: "例：雨天のため" },
      okText: "次へ", cancelText: "やめる",
    });
    if (reason === null) return;
    const ok = await confirmBox("中止にすると、申込者全員（キャンセル待ちの方を含む）にLINEでお知らせが届きます。元には戻せません。中止にしますか？", "中止にする", true);
    if (!ok) return;
  }
  btn.disabled = true;
  try {
    const r = await api("staffSetEventStatus", { eventId, status, reason });
    showStaff(status === "中止" ? `中止にしました。${r.notified}人の申込者にお知らせを送りました。` : `「${status}」にしました。`);
  } catch (e) {
    btn.disabled = false;
    alertBox(e.message);
  }
}

async function changeCapacity(btn) {
  const current = btn.dataset.current;
  const input = await dialog({
    message: `新しい定員（人）を入れてください。\n今は${current ? current + "人" : "定員なし"}、参加決定は${btn.dataset.people}人です。\n空欄にすると定員なしになります。\n増やすと、キャンセル待ちの方が申し込んだ順に繰り上がり、LINEでお知らせが届きます。`,
    input: { value: current, placeholder: "制限なしなら空欄", numeric: true },
    okText: "変更する", cancelText: "やめる",
  });
  if (input === null) return;
  btn.disabled = true;
  try {
    const r = await api("staffSetCapacity", { eventId: btn.dataset.cap, capacity: input });
    showStaff(`定員を変更しました。${r.promoted ? `キャンセル待ちから${r.promoted}件（${r.promotedPeople}人）を繰り上げ、お知らせを送りました。` : ""}`);
  } catch (e) {
    btn.disabled = false;
    alertBox(e.message);
  }
}

async function showApplicants(eventId) {
  loading();
  try {
    const r = await api("staffApplicants", { eventId });
    const active = r.applications.filter(a => a.status === "申込");
    const waiting = r.applications.filter(a => a.status === "キャンセル待ち");
    const people = active.reduce((n, a) => n + a.count, 0);
    const adult = active.reduce((n, a) => n + a.adult, 0);
    const waitPeople = waiting.reduce((n, a) => n + a.count, 0);
    let html = `<button class="link" id="back">← 担当者メニューに戻る</button>
      <div class="card"><h2>${esc(r.event.name)}</h2>${eventInfo(r.event)}
      <p class="total">参加決定 ${active.length}件・${people}人（大人${adult}・子ども${people - adult}）${r.event.capacity ? ` / 定員${r.event.capacity}人` : ""}</p>
      ${waiting.length ? `<p class="meta" style="color:var(--warn)">キャンセル待ち ${waiting.length}件・${waitPeople}人</p>` : ""}</div>`;
    if (!r.applications.length) html += `<div class="card center muted">まだ申込はありません。</div>`;
    r.applications.forEach(a => {
      const canceled = a.status === "キャンセル";
      let badge = "";
      if (a.status === "キャンセル待ち") badge = `<span class="badge warn">キャンセル待ち ${a.position}番目</span>`;
      else if (canceled) badge = `<span class="badge off">取り消し</span>`;
      html += `<div class="card"${canceled ? ' style="opacity:.55"' : ""}>
        <h2>${esc(a.name)} 様${badge}</h2>
        <table class="summary">
          <tr><th>住所</th><td>${esc(a.address)}</td></tr>
          <tr><th>電話番号</th><td><a href="tel:${esc(a.phone)}">${esc(a.phone)}</a></td></tr>
          <tr><th>参加者</th><td>${a.participants.map(p => `${esc(p.name)}（${esc(p.kind)}）`).join("<br>")}</td></tr>
          <tr><th>人数</th><td>${a.count}人（大人${a.adult}・子ども${a.child}）</td></tr>
          ${a.note ? `<tr><th>備考</th><td style="white-space:pre-wrap">${esc(a.note)}</td></tr>` : ""}
          <tr><th>受付</th><td>${esc(a.created)}　${esc(a.id)}</td></tr>
        </table>
      </div>`;
    });
    html += `<p class="muted">名簿の印刷や並べ替えは、スプレッドシートの「参加者」シートで行えます。</p>`;
    view.innerHTML = html;
    document.getElementById("back").onclick = () => showStaff();
    window.scrollTo(0, 0);
  } catch (e) {
    view.innerHTML = errorBox(e);
  }
}

// ---------- 起動 ----------
async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }
    const me = await api("whoami");
    setStaff(me);
    state.last = me.last;
    go("events");
  } catch (e) {
    renderTabs();
    view.innerHTML = errorBox(e);
  }
}
main();
</script>
</body>
</html>
